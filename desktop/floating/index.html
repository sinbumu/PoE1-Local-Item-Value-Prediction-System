<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PoE1 Item Decision</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="card" class="card neutral">
      <div class="top-row drag-region">
        <span id="source" class="source">Clipboard</span>
        <span class="drag-hint">Drag to move</span>
        <button id="settingsButton" class="no-drag" type="button">Settings</button>
        <button id="hideButton" class="no-drag" type="button">Hide</button>
      </div>
      <div id="decision" class="decision">Waiting</div>
      <div id="itemName" class="item-name">No item analyzed yet</div>
      <div class="meta-row">
        <span id="value">-</span>
        <span id="segment">-</span>
      </div>
      <p id="recommendation">Copy an English PoE1 item while Auto Watch is enabled.</p>
      <div id="controls" class="controls no-drag collapsed">
        <label>
          <span>Mode</span>
          <select id="displayMode">
            <option value="autoHide">Auto hide</option>
            <option value="keepVisible">Keep visible</option>
          </select>
        </label>
        <label>
          <span>Opacity</span>
          <input id="opacitySlider" type="range" min="25" max="100" value="95" />
        </label>
        <strong id="opacityValue">95%</strong>
        <button id="resetPosition" type="button">Reset Pos</button>
      </div>
    </main>
    <script src="./renderer.js"></script>
  </body>
</html>
