<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PoE1 Item Decision</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="card" class="card neutral">
      <div class="top-row">
        <span id="source" class="source">Clipboard</span>
        <button id="hideButton" type="button">Hide</button>
      </div>
      <div id="decision" class="decision">Waiting</div>
      <div id="itemName" class="item-name">No item analyzed yet</div>
      <div class="meta-row">
        <span id="value">-</span>
        <span id="segment">-</span>
      </div>
      <p id="recommendation">Copy an English PoE1 item while Auto Watch is enabled.</p>
    </main>
    <script src="./renderer.js"></script>
  </body>
</html>
